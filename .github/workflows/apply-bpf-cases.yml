name: Apply BPF case generation
on:
  push:
    paths:
      - .github/workflows/apply-bpf-cases.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply BPF case generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          backend = Path('backend/src/miniapp-app.ts')
          text = backend.read_text()

          session_pattern = r"type Session=\{sessionId:string;.*?feedback\?:any\};const sessions=new Map<string,Session>\(\);"
          session_replacement = """type Session={sessionId:string;language:Language;targetSkill:string;topic:string;motion:string;caseContext:string;studentRole:string;opponentRole:string;roleDuty:string;userPosition:string;aiPosition:string;round:number;maxRounds:number;messages:any[];judgeResults:MoveResult[];status:string;aiProviders:string[];coachNote?:{observation:string;advice:string;quote:string|null};feedback?:any};
const sessions=new Map<string,Session>();
const serverTopics:string[]=[];
const normalizeTopic=(value:string)=>String(value||'').toLowerCase().replace(/[^a-zа-яёәіңғүұқөһ0-9 ]/gi,' ').replace(/\\s+/g,' ').trim();
const topicWords=(value:string)=>new Set(normalizeTopic(value).split(' ').filter(word=>word.length>3));
const topicsSimilar=(left:string,right:string)=>{const a=topicWords(left),b=topicWords(right);if(!a.size||!b.size)return false;const overlap=[...a].filter(word=>b.has(word)).length;const ratio=overlap/Math.min(a.size,b.size);return normalizeTopic(left)===normalizeTopic(right)||ratio>=0.55};
const isDuplicateTopic=(topic:string,blocked:string[])=>blocked.some(old=>topicsSimilar(topic,old));
const bpRoles={
 ru:[
  {studentRole:'Премьер-министр Открывающего правительства',opponentRole:'Лидер Открывающей оппозиции',studentPosition:'Правительство',opponentPosition:'Оппозиция',roleDuty:'дайте разумную интерпретацию резолюции, представьте модель и главный аргумент правительства'},
  {studentRole:'Заместитель премьер-министра',opponentRole:'Заместитель лидера оппозиции',studentPosition:'Правительство',opponentPosition:'Оппозиция',roleDuty:'защитите кейс правительства, прямо опровергните оппозицию и углубите механизм'},
  {studentRole:'Лидер Открывающей оппозиции',opponentRole:'Премьер-министр Открывающего правительства',studentPosition:'Оппозиция',opponentPosition:'Правительство',roleDuty:'оспорьте модель правительства и постройте самостоятельный контркейс'},
  {studentRole:'Заместитель лидера оппозиции',opponentRole:'Заместитель премьер-министра',studentPosition:'Оппозиция',opponentPosition:'Правительство',roleDuty:'восстановите кейс оппозиции после атак и проведите прямое сравнительное опровержение'},
  {studentRole:'Член Закрывающего правительства',opponentRole:'Член Закрывающей оппозиции',studentPosition:'Правительство',opponentPosition:'Оппозиция',roleDuty:'дайте новое существенное расширение, не повторяя Открывающее правительство'},
  {studentRole:'Секретарь Закрывающего правительства',opponentRole:'Секретарь Закрывающей оппозиции',studentPosition:'Правительство',opponentPosition:'Оппозиция',roleDuty:'сведите основные столкновения и объясните, почему вклад правительства перевешивает'},
  {studentRole:'Член Закрывающей оппозиции',opponentRole:'Член Закрывающего правительства',studentPosition:'Оппозиция',opponentPosition:'Правительство',roleDuty:'дайте новое существенное расширение оппозиции и покажите его отличие от Открывающей оппозиции'},
  {studentRole:'Секретарь Закрывающей оппозиции',opponentRole:'Секретарь Закрывающего правительства',studentPosition:'Оппозиция',opponentPosition:'Правительство',roleDuty:'сведите раунд по главным столкновениям и объясните, почему оппозиция выигрывает сравнение'}
 ],
 kk:[
  {studentRole:'Ашушы үкіметтің Премьер-министрі',opponentRole:'Ашушы оппозицияның Лидері',studentPosition:'Үкімет',opponentPosition:'Оппозиция',roleDuty:'қарарды түсіндіріп, модель мен үкіметтің негізгі дәлелін ұсыныңыз'},
  {studentRole:'Премьер-министрдің орынбасары',opponentRole:'Оппозиция лидері орынбасары',studentPosition:'Үкімет',opponentPosition:'Оппозиция',roleDuty:'үкімет кейсін қорғап, оппозицияны тікелей терістеп, механизмді тереңдетіңіз'},
  {studentRole:'Ашушы оппозицияның Лидері',opponentRole:'Ашушы үкіметтің Премьер-министрі',studentPosition:'Оппозиция',opponentPosition:'Үкімет',roleDuty:'үкімет моделіне қарсы шығып, дербес контркейс құрыңыз'},
  {studentRole:'Оппозиция лидері орынбасары',opponentRole:'Премьер-министрдің орынбасары',studentPosition:'Оппозиция',opponentPosition:'Үкімет',roleDuty:'оппозиция кейсін қалпына келтіріп, салыстырмалы терістеу жасаңыз'},
  {studentRole:'Жабушы үкімет мүшесі',opponentRole:'Жабушы оппозиция мүшесі',studentPosition:'Үкімет',opponentPosition:'Оппозиция',roleDuty:'Ашушы үкіметті қайталамай, жаңа маңызды кеңейту беріңіз'},
  {studentRole:'Жабушы үкімет хатшысы',opponentRole:'Жабушы оппозиция хатшысы',studentPosition:'Үкімет',opponentPosition:'Оппозиция',roleDuty:'негізгі қақтығыстарды жинақтап, үкімет үлесінің басымдығын түсіндіріңіз'},
  {studentRole:'Жабушы оппозиция мүшесі',opponentRole:'Жабушы үкімет мүшесі',studentPosition:'Оппозиция',opponentPosition:'Үкімет',roleDuty:'оппозицияның жаңа маңызды кеңейтуін беріңіз'},
  {studentRole:'Жабушы оппозиция хатшысы',opponentRole:'Жабушы үкімет хатшысы',studentPosition:'Оппозиция',opponentPosition:'Үкімет',roleDuty:'раундты негізгі қақтығыстар бойынша жинақтап, оппозицияның неге жеңетінін түсіндіріңіз'}
 ]
};
const bpFallbacks={
 ru:[
  {motion:'Эта Палата запретит школам публиковать рейтинги учеников',context:'Городская школа ежемесячно вывешивает общий рейтинг успеваемости. Администрация считает это мотивацией, а часть родителей говорит о давлении и стигматизации.',opponentStatement:'Публичный рейтинг заставляет учеников прикладывать больше усилий и даёт родителям прозрачную картину.'},
  {motion:'Эта Палата введёт обязательный год общественной службы после школы',context:'Государство предлагает выпускникам выбрать работу в больнице, экологическом проекте или социальной службе до поступления в университет.',opponentStatement:'Обязательная служба отнимает у молодых людей право самостоятельно решать, как начинать взрослую жизнь.'},
  {motion:'Эта Палата обяжет социальные сети отключать персональные рекомендации для несовершеннолетних',context:'Платформы формируют ленту подростка по его прошлым просмотрам. Закон предлагает оставить только хронологическую ленту.',opponentStatement:'Персональные рекомендации помогают подросткам находить полезные сообщества, а запрет ухудшит их опыт.'},
  {motion:'Эта Палата предпочла бы город без частных автомобилей в центре',context:'Муниципалитет планирует закрыть центр для личных машин, расширить автобусы и велодорожки, но бизнес опасается падения посещаемости.',opponentStatement:'Запрет сильнее всего ударит по людям, которым общественный транспорт не подходит по здоровью или графику.'},
  {motion:'Эта Палата разрешит ученикам использовать ИИ при выполнении домашних заданий',context:'Школа рассматривает правило: ИИ разрешён, если ученик указывает запросы и отдельно объясняет полученный результат.',opponentStatement:'Даже с раскрытием запросов ИИ заменяет самостоятельное мышление и делает оценивание бессмысленным.'},
  {motion:'Эта Палата будет финансировать массовый спорт вместо профессиональных клубов',context:'Город должен выбрать между субсидией известному клубу и бесплатными секциями во всех районах.',opponentStatement:'Профессиональный клуб создаёт общую идентичность и вдохновляет больше людей, чем районные секции.'},
  {motion:'Эта Палата запретит рекламу быстрого питания, направленную на детей',context:'Компании используют блогеров, игры и ярких персонажей для продвижения еды среди детей.',opponentStatement:'Ответственность лежит на родителях, а запрет рекламы несправедливо ограничивает легальный бизнес.'},
  {motion:'Эта Палата заменит часть школьных экзаменов долгосрочными проектами',context:'Министерство предлагает оценивать учеников по исследовательским проектам, которые выполняются несколько месяцев.',opponentStatement:'Проекты легче выполнить с чужой помощью, поэтому они хуже показывают реальные знания, чем экзамен.'}
 ],
 kk:[
  {motion:'Бұл Палата мектептерге оқушылар рейтингін жариялауға тыйым салады',context:'Қалалық мектеп ай сайын үлгерім рейтингін жариялайды. Әкімшілік мұны ынталандыру деп санайды, ал ата-аналар қысым туралы айтады.',opponentStatement:'Ашық рейтинг оқушыларды көбірек еңбектенуге ынталандырады және ата-аналарға анық ақпарат береді.'},
  {motion:'Бұл Палата мектептен кейін міндетті қоғамдық қызмет енгізеді',context:'Түлектер университетке дейін аурухана, экологиялық жоба немесе әлеуметтік қызметтің бірін таңдауы керек.',opponentStatement:'Міндетті қызмет жастардың ересек өмірін қалай бастау керегін өздері шешу құқығын шектейді.'},
  {motion:'Бұл Палата әлеуметтік желілерді кәмелетке толмағандарға жеке ұсыныстарды өшіруге міндеттейді',context:'Платформалар жасөспірімнің бұрынғы қаралымдары бойынша таспа құрады. Заң тек хронологиялық таспа қалдыруды ұсынады.',opponentStatement:'Жеке ұсыныстар пайдалы қауымдастықтарды табуға көмектеседі, ал тыйым тәжірибені нашарлатады.'},
  {motion:'Бұл Палата қала орталығында жеке көліксіз кеңістікті қолдайды',context:'Қала орталықты жеке көліктерге жауып, автобустар мен велосипед жолдарын көбейтуді жоспарлап отыр.',opponentStatement:'Тыйым қоғамдық көлік денсаулығы немесе жұмыс кестесі бойынша сәйкес келмейтін адамдарға зиян келтіреді.'}
 ]
};"""
          text, count = re.subn(session_pattern, session_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Session block was not replaced')

          create_pattern = r"async function createSession\(language:Language,targetSkill:string\):Promise<Session>\{.*?\nfunction validateMove"
          create_replacement = r"""async function createSession(language:Language,targetSkill:string,recentTopics:string[]=[]):Promise<Session>{
 const lang=language==='kk'?'тек қазақ тілінде':'только на русском языке';
 const roles=bpRoles[language];
 const role=roles[Math.floor(Math.random()*roles.length)]!;
 const blocked=[...recentTopics.filter(x=>typeof x==='string').slice(0,40),...serverTopics];
 const domains=language==='kk'?['білім','технология','әлеуметтік саясат','мәдениет','экономика','әділет','медиа','экология']:['образование','технологии','социальная политика','культура','экономика','правосудие','медиа','экология'];
 let selected:any=null;
 let provider='mock';
 for(let attempt=0;attempt<3&&!selected;attempt++){
  const domain=domains[(Date.now()+attempt)%domains.length];
  const ai=await routedChat({responseFormat:'json_object',temperature:.82,maxTokens:700,messages:[
   {role:'system',content:`Ты создаёшь уникальную тренировочную ситуацию Британского парламентского формата. Пиши ${lang}, без английского. БПФ состоит из Открывающего правительства, Открывающей оппозиции, Закрывающего правительства и Закрывающей оппозиции; учитывай обязанность конкретного спикера и необходимость сравнительного столкновения. Создай не общий вопрос, а конкретный кейс с участниками, решением и конфликтом интересов. Не придумывай ничего об ученике. Верни только JSON: {"motion":"резолюция в форме Эта Палата...","context":"2 конкретных предложения о ситуации и участниках","opponentStatement":"конкретный аргумент или реплика соперника, на которую нужно ответить"}. Новая резолюция не должна совпадать по смыслу с запрещёнными темами.`},
   {role:'user',content:`Область: ${domain}. Роль ученика: ${role.studentRole}. Обязанность роли: ${role.roleDuty}. Роль соперника: ${role.opponentRole}. Тренируемый навык: ${targetSkill}. Запрещённые прошлые темы: ${JSON.stringify(blocked)}. Попытка генерации: ${attempt+1}.`}
  ]});
  provider=ai.provider;
  const candidate=jsonFrom(ai.text);
  const valid=candidate&&['motion','context','opponentStatement'].every(key=>typeof candidate[key]==='string'&&candidate[key].trim()&&!wrongLanguage(candidate[key],language));
  if(valid&&!isDuplicateTopic(candidate.motion,blocked))selected=candidate;
 }
 if(!selected){
  const list=bpFallbacks[language];
  selected=list.find(item=>!isDuplicateTopic(item.motion,blocked))||list[Math.floor(Math.random()*list.length)]!;
 }
 const motion=String(selected.motion).trim();
 serverTopics.push(motion);if(serverTopics.length>200)serverTopics.shift();
 const scenario=language==='kk'
  ?`Сіздің қарсыласыңыз — ${role.opponentRole}, ${role.opponentPosition} жағында — былай деді: «${selected.opponentStatement}» Сіз ${role.studentRole} ретінде ${role.roleDuty}. Не деп жауап бересіз?`
  :`Ваш соперник — ${role.opponentRole}, выступающий за сторону «${role.opponentPosition}», — сказал: «${selected.opponentStatement}» Ваша задача как ${role.studentRole}: ${role.roleDuty}. Что вы ответите?`;
 const s:Session={sessionId:randomUUID(),language,targetSkill,topic:motion,motion,caseContext:String(selected.context),studentRole:role.studentRole,opponentRole:role.opponentRole,roleDuty:role.roleDuty,userPosition:`${role.studentPosition}: ${role.roleDuty}`,aiPosition:role.opponentPosition,round:1,maxRounds:4,messages:[{id:randomUUID(),speaker:'ai',text:scenario,round:1}],judgeResults:[],status:'active',aiProviders:[provider]};
 sessions.set(s.sessionId,s);return s;
}
function validateMove"""
          text, count = re.subn(create_pattern, create_replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('createSession was not replaced')

          text = text.replace(
              "nextQuestion — один вопрос, который проверяет самый важный логический пробел.",
              "nextQuestion — новая конкретная БПФ-ситуация следующего хода: назови роль соперника, дословно сформулируй его новую атаку на последний ответ и заверши фразой «Что вы ответите?». Это не должен быть абстрактный вопрос."
          )
          text = text.replace(
              "Позиция ученика: ${s.userPosition}\\nПозиция другой стороны: ${s.aiPosition}\\nВопрос текущего хода: ${lastAi(s)}",
              "Роль ученика: ${s.studentRole}\\nОбязанность роли: ${s.roleDuty}\\nРоль соперника: ${s.opponentRole}\\nСторона ученика: ${s.userPosition}\\nСторона соперника: ${s.aiPosition}\\nСитуация текущего хода: ${lastAi(s)}"
          )
          old_call = "await createSession(language,String(b.skill||(language==='kk'?'Теріске шығару':'Опровержение')))"
          new_call = "await createSession(language,String(b.skill||(language==='kk'?'Теріске шығару':'Опровержение')),Array.isArray(b.recentTopics)?b.recentTopics:[])"
          if old_call not in text:
              raise SystemExit('createSession route call not found')
          text = text.replace(old_call, new_call, 1)
          backend.write_text(text)

          frontend = Path('miniapp/app.js')
          js = frontend.read_text()
          old_body = "body:JSON.stringify({language:state.language,skill:state.selected})"
          new_body = "body:JSON.stringify({language:state.language,skill:state.selected,recentTopics:state.history.map(x=>x.topic).filter(Boolean).slice(0,40)})"
          if old_body not in js:
              raise SystemExit('start round body not found')
          js = js.replace(old_body, new_body, 1)
          old_view = '<h1 class="topic">${esc(s.topic)}</h1><div class="position"><b>${t(\'yourPosition\')}:</b> ${esc(s.userPosition)}</div>'
          new_view = '<h1 class="topic">${esc(s.topic)}</h1><div class="bp-meta"><span>БПФ</span><b>${esc(s.studentRole||\'\')}</b><small>${state.language===\'kk\'?\'Қарсылас\':\'Соперник\'}: ${esc(s.opponentRole||\'\')}</small></div>${s.caseContext?`<section class="case-context"><strong>${state.language===\'kk\'?\'Жағдай\':\'Ситуация\'}</strong><p>${esc(s.caseContext)}</p></section>`:\'\'}<div class="position"><b>${t(\'yourPosition\')}:</b> ${esc(s.userPosition)}</div>'
          if old_view not in js:
              raise SystemExit('arena topic view not found')
          js = js.replace(old_view, new_view, 1)
          frontend.write_text(js)

          index = Path('miniapp/index.html')
          html = index.read_text().replace('/styles.css?v=6','/styles.css?v=7').replace('/app.js?v=6','/app.js?v=7')
          index.write_text(html)

          styles = Path('miniapp/styles.css')
          css = styles.read_text()
          css += '\n.bp-meta{display:grid;gap:4px;margin:10px 0 14px;padding:13px 15px;border-radius:16px;background:#e9edff;border:1px solid #c9d1f7}.bp-meta span{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.08em}.bp-meta b{font-size:13px}.bp-meta small{font-size:11px;color:var(--muted)}.case-context{margin:0 0 12px;padding:15px;border-radius:17px;background:var(--card);border:1px solid var(--line)}.case-context strong{font-size:11px;color:var(--blue)}.case-context p{font-size:12px;line-height:1.5;margin:7px 0 0}\n'
          styles.write_text(css)
          PY
      - name: Verify build and frontend syntax
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          node --check miniapp/app.js
      - name: Commit verified implementation
        run: |
          rm .github/workflows/apply-bpf-cases.yml
          git config user.name "Talqyla BPF Builder"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/miniapp-app.ts miniapp/app.js miniapp/index.html miniapp/styles.css .github/workflows/apply-bpf-cases.yml
          git commit -m "Generate unique BPF situational cases"
          git push origin main
