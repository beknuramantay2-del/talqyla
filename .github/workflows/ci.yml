name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: development
  DATABASE_URL: postgresql://talqyla:talqyla@localhost:5432/talqyla?schema=public
  REDIS_URL: redis://localhost:6379
  API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  CORS_ORIGIN: http://localhost:3000
  JWT_ACCESS_SECRET: ci-only-secret-not-a-credential

jobs:
  quality:
    name: Build, lint, typecheck, all tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace
        run: pnpm -r run build

      - name: Build Railway backend
        run: pnpm run build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test root Railway backend
        run: pnpm test

      - name: Test every workspace package
        run: pnpm -r --if-present test

      - name: Audit production dependencies (critical blocks the build)
        run: pnpm audit --prod --audit-level=critical

      - name: Audit all dependencies (high, report only until Next 16 lands)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  railway-image:
    name: Build and smoke Railway image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build exact Railway Docker image
        run: docker build --tag talqyla-railway:${{ github.sha }} .

      - name: Start production container
        run: |
          docker run --detach --rm \
            --name talqyla-railway-smoke \
            --publish 127.0.0.1:8787:8080 \
            --env PORT=8080 \
            --env NODE_ENV=production \
            talqyla-railway:${{ github.sha }}

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs talqyla-railway-smoke
          exit 1

      - name: Smoke static Mini App
        run: |
          curl --fail --silent http://127.0.0.1:8787/ > /tmp/index.html
          grep -qi "talqyla" /tmp/index.html

      - name: Smoke debate start in provider-free mode
        run: |
          curl --fail --silent \
            --header 'content-type: application/json' \
            --data '{"language":"ru","skill":"Опровержение","recentTopics":[]}' \
            http://127.0.0.1:8787/api/debate/start > /tmp/session.json
          node -e "const x=require('/tmp/session.json'); if(!x.sessionId||x.status!=='active') process.exit(1)"

      - name: Container logs
        if: always()
        run: docker logs talqyla-railway-smoke || true

      - name: Stop container
        if: always()
        run: docker stop talqyla-railway-smoke || true

  integration:
    name: Migrations and smoke test (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talqyla
          POSTGRES_PASSWORD: talqyla
          POSTGRES_DB: talqyla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talqyla -d talqyla"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed topics
        run: pnpm db:seed

      - name: Build workspace
        run: pnpm -r run build

      - name: Start API
        run: |
          node apps/api/dist/server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health/ready > /dev/null 2>&1; then
              echo "API is ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready. Logs:"
          cat /tmp/api.log
          exit 1

      - name: Smoke test
        run: pnpm smoke

      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
