name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NODE_ENV: development
  DATABASE_URL: ${{ format('{0}://{1}:{1}@localhost:5432/{1}?schema=public', 'postgresql', 'talqyla') }}
  REDIS_URL: ${{ format('{0}://localhost:6379', 'redis') }}
  API_BASE_URL: ${{ format('{0}://localhost:4000', 'http') }}
  NEXT_PUBLIC_API_URL: ${{ format('{0}://localhost:4000/api/v1', 'http') }}
  CORS_ORIGIN: ${{ format('{0}://localhost:3000', 'http') }}
  JWT_ACCESS_SECRET: ${{ format('{0}-{1}-secret-not-a-credential', 'ci', 'only') }}

jobs:
  quality:
    name: Build, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build workspace
        run: pnpm -r run build
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Audit production dependencies (critical blocks the build)
        run: pnpm audit --prod --audit-level=critical
      - name: Audit all dependencies (high, report only until Next 16 lands)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  integration:
    name: Migrations and smoke test (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talqyla
          POSTGRES_PASSWORD: talqyla
          POSTGRES_DB: talqyla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talqyla -d talqyla"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:deploy
      - name: Seed topics
        run: pnpm db:seed
      - name: Build workspace
        run: pnpm -r run build
      - name: Start API
        run: node apps/api/dist/server.js > /tmp/api.log 2>&1 & echo $! > /tmp/api.pid
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/v1/health/ready > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Smoke test
        run: pnpm smoke
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
