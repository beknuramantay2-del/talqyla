name: Commit verified persistent plan
on:
  push:
    paths:
      - .github/workflows/commit-persistent-plan.yml
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified plan migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/persistent-plan.yml').read_text()
          marker="          python3 - <<'PY'\n"
          script=workflow.split(marker,1)[1].split("\n          PY",1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script,'persistent_plan_migration.py','exec'))
          PY
      - name: Reconfirm application
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          node --check miniapp/app.js
          pnpm run build
      - name: Commit clean implementation
        run: |
          rm -f PERSISTENT_PLAN_DIAGNOSTIC.txt
          rm -f .github/workflows/persistent-plan.yml
          rm -f .github/workflows/commit-persistent-plan.yml
          git config user.name "Talqyla Plan Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep unfinished plan steps and improve microphone"
          git push origin main
