name: Commit verified Talqyla redesign
on:
  push:
    paths:
      - .github/workflows/commit-redesign.yml
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified redesign migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/redesign-miniapp.yml').read_text()
          marker="          python3 - <<'PY'\n"
          script=workflow.split(marker,1)[1].split("\n          PY",1)[0]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script,'redesign_migration.py','exec'))
          PY
      - name: Reconfirm frontend and build
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          node --check miniapp/app.js
          pnpm run build
      - name: Commit clean redesign
        run: |
          rm -f REDESIGN_DIAGNOSTIC.txt
          rm -f .github/workflows/redesign-miniapp.yml
          rm -f .github/workflows/commit-redesign.yml
          git config user.name "Talqyla Design Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Mini App with vivid Talqyla UI"
          git push origin main
