          index.write_text(html)
          PY

          cat > .env.example <<'EOF'
          # Add secret values only in Railway Variables. Never commit real keys.
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_WEBHOOK_SECRET=
          TELEGRAM_WEBAPP_URL=

          # LLM load-aware routing: Groq -> Google -> OpenRouter -> backup -> OpenCode Zen.
          # Busy providers are skipped; 429/5xx providers enter a temporary cooldown.
          GROQ_API_KEY=
          GROQ_MODEL=llama-3.1-8b-instant
          GOOGLE_API_KEY=
          GOOGLE_MODEL=gemini-3.8-flash
          OPENROUTER_API_KEY=
          OPENROUTER_MODEL=meta-llama/llama-3.1-8b-instruct:free
          OPENROUTER_BACKUP_API_KEY=
          OPENROUTER_BACKUP_MODEL=google/gemma-2-9b-it:free
          OPENCODE_ZEN_API_KEY=
          OPENCODE_ZEN_BASE_URL=https://opencode.ai/zen/v1
          OPENCODE_ZEN_MODEL=deepseek-v4-flash-free
          LLM_MAX_CONCURRENCY_PER_PROVIDER=2
          LLM_PROVIDER_COOLDOWN_MS=45000

          # Voice transcription routing:
          # OpenAI key pool first -> Deepgram -> Groq.
          STT_PROVIDER=auto
          OPENAI_STT_API_KEY_1=
          OPENAI_STT_API_KEY_2=
          OPENAI_STT_API_KEY_3=
          OPENAI_STT_MODEL=gpt-4o-mini-transcribe
          OPENAI_STT_MAX_CONCURRENCY_PER_KEY=1
          OPENAI_STT_COOLDOWN_MS=60000
          DEEPGRAM_API_KEY=
          DEEPGRAM_MODEL=nova-3
          GROQ_STT_MODEL=whisper-large-v3-turbo

          NODE_ENV=production
          EOF
      - name: Verify routing and application
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          node --check miniapp/app.js
          pnpm run build
          grep -q "gpt-4o-mini-transcribe" backend/src/config.ts
          grep -q "OPENAI_STT_API_KEY_3" .env.example
          grep -q "screen-home" miniapp/styles.css
      - name: Commit verified implementation
        run: |
          rm .github/workflows/desktop-openai-stt.yml
          git config user.name "Talqyla Routing Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Support desktop and prioritize OpenAI transcription"
          git push origin main
