name: Add desktop and OpenAI STT routing
on:
  push:
    paths:
      - .github/workflows/desktop-openai-stt.yml
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Implement routing and desktop support
        run: |
          cat > backend/src/config.ts <<'EOF'
          export type ProviderName = 'groq' | 'openrouter' | 'openrouter_backup' | 'google' | 'opencode_zen';

          export type ModelProvider = {
            name: ProviderName;
            baseUrl: string;
            apiKey?: string;
            model?: string;
            enabled: boolean;
            headers?: Record<string, string>;
          };

          const env = process.env;
          const positiveNumber = (value: string | undefined, fallback: number) => {
            const parsed = Number(value);
            return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
          };

          export const llmProviders: ModelProvider[] = [
            {
              name: 'groq',
              baseUrl: 'https://api.groq.com/openai/v1',
              apiKey: env.GROQ_API_KEY,
              model: env.GROQ_MODEL || 'llama-3.1-8b-instant',
              enabled: Boolean(env.GROQ_API_KEY),
            },
            {
              name: 'google',
              baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai',
              apiKey: env.GOOGLE_API_KEY,
              model: env.GOOGLE_MODEL || 'gemini-3.8-flash',
              enabled: Boolean(env.GOOGLE_API_KEY),
            },
            {
              name: 'openrouter',
              baseUrl: 'https://openrouter.ai/api/v1',
              apiKey: env.OPENROUTER_API_KEY,
              model: env.OPENROUTER_MODEL || 'meta-llama/llama-3.1-8b-instruct:free',
              enabled: Boolean(env.OPENROUTER_API_KEY),
              headers: {
                'HTTP-Referer': env.TELEGRAM_WEBAPP_URL || 'http://localhost:5173',
                'X-Title': 'Talqyla',
              },
            },
            {
              name: 'openrouter_backup',
              baseUrl: 'https://openrouter.ai/api/v1',
              apiKey: env.OPENROUTER_BACKUP_API_KEY,
              model: env.OPENROUTER_BACKUP_MODEL || 'google/gemma-2-9b-it:free',
              enabled: Boolean(env.OPENROUTER_BACKUP_API_KEY),
              headers: {
                'HTTP-Referer': env.TELEGRAM_WEBAPP_URL || 'http://localhost:5173',
                'X-Title': 'Talqyla',
              },
            },
            {
              name: 'opencode_zen',
              baseUrl: env.OPENCODE_ZEN_BASE_URL || '',
              apiKey: env.OPENCODE_ZEN_API_KEY,
              model: env.OPENCODE_ZEN_MODEL,
              enabled: Boolean(env.OPENCODE_ZEN_API_KEY && env.OPENCODE_ZEN_BASE_URL && env.OPENCODE_ZEN_MODEL),
            },
          ];

          export const llmRoutingConfig = {
            maxConcurrencyPerProvider: positiveNumber(env.LLM_MAX_CONCURRENCY_PER_PROVIDER, 2),
            cooldownMs: positiveNumber(env.LLM_PROVIDER_COOLDOWN_MS, 45_000),
          };

          const openAiSttApiKeys = [
            env.OPENAI_STT_API_KEY_1,
            env.OPENAI_STT_API_KEY_2,
            env.OPENAI_STT_API_KEY_3,
          ].filter((value): value is string => Boolean(value?.trim()));

          export const sttConfig = {
            provider: env.STT_PROVIDER || 'auto',
            openAiApiKeys: openAiSttApiKeys,
            openAiModel: env.OPENAI_STT_MODEL || 'gpt-4o-mini-transcribe',
            openAiMaxConcurrencyPerKey: positiveNumber(env.OPENAI_STT_MAX_CONCURRENCY_PER_KEY, 1),
            openAiCooldownMs: positiveNumber(env.OPENAI_STT_COOLDOWN_MS, 60_000),
            deepgramApiKey: env.DEEPGRAM_API_KEY,
            deepgramModel: env.DEEPGRAM_MODEL || 'nova-3',
            groqApiKey: env.GROQ_API_KEY,
            groqModel: env.GROQ_STT_MODEL || 'whisper-large-v3-turbo',
          };

          export const telegramConfig = {
            botToken: env.TELEGRAM_BOT_TOKEN,
            webAppUrl: env.TELEGRAM_WEBAPP_URL || 'http://localhost:5173',
          };
          EOF

          cat > backend/src/ai/stt.ts <<'EOF'
          import { sttConfig } from '../config.js';

          type SttResult = {
            text: string;
            provider: 'openai' | 'deepgram' | 'groq' | 'none';
            model: string;
            fallback: boolean;
          };

          type OpenAiKeyState = {
            key: string;
            slot: number;
            inFlight: number;
            cooldownUntil: number;
            lastUsed: number;
          };

          const openAiKeys: OpenAiKeyState[] = sttConfig.openAiApiKeys.map((key, index) => ({
            key,
            slot: index + 1,
            inFlight: 0,
            cooldownUntil: 0,
            lastUsed: 0,
          }));

          const fileNameForMime = (mimeType: string) => {
            if (mimeType.includes('wav')) return 'voice.wav';
            if (mimeType.includes('mpeg') || mimeType.includes('mp3')) return 'voice.mp3';
            if (mimeType.includes('mp4') || mimeType.includes('m4a')) return 'voice.m4a';
            if (mimeType.includes('ogg')) return 'voice.ogg';
            return 'voice.webm';
          };

          const responseError = async (provider: string, response: Response) => {
            const detail = (await response.text().catch(() => '')).slice(0, 240);
            console.error({ event: 'stt_error', provider, status: response.status, detail });
            const error = new Error(`${provider} failed with ${response.status}`) as Error & { status?: number };
            error.status = response.status;
            return error;
          };

          async function transcribeWithOpenAi(
            state: OpenAiKeyState,
            bytes: Uint8Array<ArrayBuffer>,
            mimeType: string,
          ): Promise<SttResult> {
            const form = new FormData();
            form.set('model', sttConfig.openAiModel);
            form.set('file', new Blob([bytes], { type: mimeType }), fileNameForMime(mimeType));
            const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
              method: 'POST',
              signal: AbortSignal.timeout(45_000),
              headers: { authorization: `Bearer ${state.key}` },
              body: form,
            });
            if (!response.ok) throw await responseError(`openai_stt_${state.slot}`, response);
            const data = await response.json();
            const text = String(data?.text || '').trim();
            if (!text) throw new Error('OpenAI STT returned empty text');
            return { text, provider: 'openai', model: sttConfig.openAiModel, fallback: false };
          }

          async function tryOpenAiPool(bytes: Uint8Array<ArrayBuffer>, mimeType: string) {
            const attempted = new Set<number>();
            while (attempted.size < openAiKeys.length) {
              const now = Date.now();
              const state = openAiKeys
                .filter(item => !attempted.has(item.slot))
                .filter(item => item.cooldownUntil <= now)
                .filter(item => item.inFlight < sttConfig.openAiMaxConcurrencyPerKey)
                .sort((left, right) => left.inFlight - right.inFlight || left.lastUsed - right.lastUsed || left.slot - right.slot)[0];
              if (!state) return null;
              attempted.add(state.slot);
              state.inFlight += 1;
              state.lastUsed = now;
              try {
                const result = await transcribeWithOpenAi(state, bytes, mimeType);
                console.log({ event: 'stt_route', provider: 'openai', keySlot: state.slot, model: sttConfig.openAiModel });
                return result;
              } catch (error) {
                const status = (error as Error & { status?: number }).status;
                if (status === 429 || (status && status >= 500)) {
                  state.cooldownUntil = Date.now() + sttConfig.openAiCooldownMs;
                } else if (status && status >= 400 && status < 500) {
                  return null;
                }
              } finally {
                state.inFlight = Math.max(0, state.inFlight - 1);
              }
            }
            return null;
          }

          async function tryDeepgram(bytes: Uint8Array<ArrayBuffer>, mimeType: string): Promise<SttResult | null> {
            if (!sttConfig.deepgramApiKey) return null;
            const model = sttConfig.deepgramModel;
            const url = 'https://api.deepgram.com/v1/listen?model=' + encodeURIComponent(model) + '&smart_format=true&detect_language=true';
            const response = await fetch(url, {
              method: 'POST',
              signal: AbortSignal.timeout(45_000),
              headers: { authorization: `Token ${sttConfig.deepgramApiKey}`, 'content-type': mimeType },
              body: bytes,
            });
            if (!response.ok) {
              await responseError('deepgram', response);
              return null;
            }
            const data = await response.json();
            const text = String(data?.results?.channels?.[0]?.alternatives?.[0]?.transcript || '').trim();
            if (!text) return null;
            console.log({ event: 'stt_route', provider: 'deepgram', model });
            return { text, provider: 'deepgram', model, fallback: openAiKeys.length > 0 };
          }

          async function tryGroq(bytes: Uint8Array<ArrayBuffer>, mimeType: string): Promise<SttResult | null> {
            if (!sttConfig.groqApiKey) return null;
            const form = new FormData();
            form.set('model', sttConfig.groqModel);
            form.set('file', new Blob([bytes], { type: mimeType }), fileNameForMime(mimeType));
            const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
              method: 'POST',
              signal: AbortSignal.timeout(45_000),
              headers: { authorization: `Bearer ${sttConfig.groqApiKey}` },
              body: form,
            });
            if (!response.ok) {
              await responseError('groq', response);
              return null;
            }
            const data = await response.json();
            const text = String(data?.text || '').trim();
            if (!text) return null;
            console.log({ event: 'stt_route', provider: 'groq', model: sttConfig.groqModel });
            return { text, provider: 'groq', model: sttConfig.groqModel, fallback: openAiKeys.length > 0 || Boolean(sttConfig.deepgramApiKey) };
          }

          export function configuredSttProviders() {
            const now = Date.now();
            return {
              mode: sttConfig.provider,
              primary: {
                name: 'openai',
                model: sttConfig.openAiModel,
                keyCount: openAiKeys.length,
                availableKeys: openAiKeys.filter(item => item.cooldownUntil <= now && item.inFlight < sttConfig.openAiMaxConcurrencyPerKey).length,
                maxConcurrencyPerKey: sttConfig.openAiMaxConcurrencyPerKey,
              },
              fallbacks: [
                ...(sttConfig.deepgramApiKey ? [{ name: 'deepgram', model: sttConfig.deepgramModel }] : []),
                ...(sttConfig.groqApiKey ? [{ name: 'groq', model: sttConfig.groqModel }] : []),
              ],
            };
          }

          export async function transcribeAudio(audio: ArrayBufferLike, mimeType = 'audio/webm') {
            const source = Buffer.from(audio);
            const bytes = new Uint8Array(source.length);
            bytes.set(source);
            const mode = sttConfig.provider.toLowerCase();

            if ((mode === 'auto' || mode === 'openai') && openAiKeys.length) {
              const result = await tryOpenAiPool(bytes, mimeType);
              if (result) return result;
            }
            if (mode === 'auto' || mode === 'openai' || mode === 'deepgram') {
              const result = await tryDeepgram(bytes, mimeType);
              if (result) return result;
            }
            const groq = await tryGroq(bytes, mimeType);
            if (groq) return groq;
            return { text: '', provider: 'none', model: 'none', fallback: true } satisfies SttResult;
          }
          EOF

          cat > backend/src/ai/router.ts <<'EOF'
          import { llmProviders, llmRoutingConfig, type ModelProvider } from '../config.js';

          type ChatMessage = { role: 'system' | 'user' | 'assistant'; content: string };
          export type ChatRequest = { messages: ChatMessage[]; temperature?: number; maxTokens?: number; responseFormat?: 'json_object' | 'text' };
          type ProviderState = { inFlight: number; cooldownUntil: number; lastUsed: number; successes: number; failures: number };

          const providerStates = new Map(llmProviders.map(provider => [provider.name, { inFlight: 0, cooldownUntil: 0, lastUsed: 0, successes: 0, failures: 0 }]));

          class ProviderError extends Error {
            constructor(message: string, readonly status?: number) { super(message); }
          }

          async function callOpenAICompatible(provider: ModelProvider, request: ChatRequest): Promise<string> {
            if (!provider.enabled || !provider.apiKey || !provider.model) throw new ProviderError(`${provider.name} is not configured`);
            const response = await fetch(`${provider.baseUrl}/chat/completions`, {
              method: 'POST',
              signal: AbortSignal.timeout(25_000),
              headers: { 'content-type': 'application/json', authorization: `Bearer ${provider.apiKey}`, ...(provider.headers || {}) },
              body: JSON.stringify({ model: provider.model, messages: request.messages, temperature: request.temperature ?? 0.4, max_tokens: request.maxTokens ?? 300, response_format: request.responseFormat === 'json_object' ? { type: 'json_object' } : undefined }),
            });
            if (!response.ok) throw new ProviderError(`${provider.name} failed: ${response.status} ${(await response.text().catch(() => '')).slice(0, 240)}`, response.status);
            const data = await response.json();
            return String(data?.choices?.[0]?.message?.content || '');
          }

          export async function routedChat(request: ChatRequest): Promise<{ text: string; provider: string; model?: string; fallback: boolean }> {
            const enabled = llmProviders.filter(provider => provider.enabled);
            const attempted = new Set<string>();
            while (attempted.size < enabled.length) {
              const now = Date.now();
              const candidates = enabled
                .filter(provider => !attempted.has(provider.name))
                .filter(provider => (providerStates.get(provider.name)?.cooldownUntil || 0) <= now)
                .sort((left, right) => {
                  const leftState = providerStates.get(left.name)!;
                  const rightState = providerStates.get(right.name)!;
                  const leftOverloaded = leftState.inFlight >= llmRoutingConfig.maxConcurrencyPerProvider ? 1 : 0;
                  const rightOverloaded = rightState.inFlight >= llmRoutingConfig.maxConcurrencyPerProvider ? 1 : 0;
                  return leftOverloaded - rightOverloaded || leftState.inFlight - rightState.inFlight || enabled.indexOf(left) - enabled.indexOf(right);
                });
              const provider = candidates[0];
              if (!provider) break;
              attempted.add(provider.name);
              const state = providerStates.get(provider.name)!;
              state.inFlight += 1;
              state.lastUsed = now;
              try {
                const text = await callOpenAICompatible(provider, request);
                if (!text.trim()) throw new ProviderError(`${provider.name} returned empty text`, 502);
                state.successes += 1;
                console.log({ event: 'llm_route', provider: provider.name, model: provider.model, fallback: enabled.indexOf(provider) > 0 });
                return { text, provider: provider.name, model: provider.model, fallback: enabled.indexOf(provider) > 0 };
              } catch (error) {
                state.failures += 1;
                const status = error instanceof ProviderError ? error.status : undefined;
                if (status === 429 || (status && status >= 500)) state.cooldownUntil = Date.now() + llmRoutingConfig.cooldownMs;
                console.error({ event: 'llm_provider_error', provider: provider.name, status, error: error instanceof Error ? error.message : String(error) });
              } finally {
                state.inFlight = Math.max(0, state.inFlight - 1);
              }
            }
            return { text: '', provider: 'mock', fallback: true };
          }

          export function configuredProviderNames() {
            return llmProviders.filter(provider => provider.enabled).map(provider => ({ name: provider.name, model: provider.model }));
          }

          export function providerRoutingStatus() {
            const now = Date.now();
            return llmProviders.filter(provider => provider.enabled).map(provider => {
              const state = providerStates.get(provider.name)!;
              return {
                name: provider.name,
                model: provider.model,
                inFlight: state.inFlight,
                coolingDown: state.cooldownUntil > now,
                successes: state.successes,
                failures: state.failures,
              };
            });
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          backend=Path('backend/src/miniapp-app.ts')
          text=backend.read_text()
          text=text.replace("import { routedChat, configuredProviderNames } from './ai/router.js';","import { routedChat, configuredProviderNames, providerRoutingStatus } from './ai/router.js';",1)
          text=text.replace("import { transcribeAudio } from './ai/stt.js';","import { transcribeAudio, configuredSttProviders } from './ai/stt.js';",1)
          old="if(req.url==='/health')return res.end(JSON.stringify({ok:true,app:'Talqyla Mini App',providers:configuredProviderNames().map(x=>x.name),stt:Boolean(process.env.GROQ_API_KEY||process.env.DEEPGRAM_API_KEY)}));if(req.url==='/api/providers')return res.end(JSON.stringify({llm:configuredProviderNames(),stt:{groq:Boolean(process.env.GROQ_API_KEY),deepgram:Boolean(process.env.DEEPGRAM_API_KEY)}}));"
          new="if(req.url==='/health')return res.end(JSON.stringify({ok:true,app:'Talqyla Mini App',providers:configuredProviderNames().map(x=>x.name),stt:configuredSttProviders()}));if(req.url==='/api/providers')return res.end(JSON.stringify({llm:configuredProviderNames(),llmRouting:providerRoutingStatus(),stt:configuredSttProviders()}));"
          if text.count(old)!=1: raise SystemExit('Provider endpoint marker not found exactly once')
          text=text.replace(old,new,1)
          old_log="console.log('STT configured:',Boolean(process.env.GROQ_API_KEY||process.env.DEEPGRAM_API_KEY));"
          new_log="console.log('STT routing:',configuredSttProviders());"
          if text.count(old_log)!=1: raise SystemExit('STT startup log marker not found exactly once')
          text=text.replace(old_log,new_log,1)
          backend.write_text(text)

          app=Path('miniapp/app.js')
          js=app.read_text()
          old_shell='<main class="screen">${state.onboarded?brand():\'\'}${html}</main>'
          new_shell='<main class="screen screen-${esc(state.screen)}">${state.onboarded?brand():\'\'}${html}</main>'
          if js.count(old_shell)!=1: raise SystemExit('Desktop screen class marker not found exactly once')
          js=js.replace(old_shell,new_shell,1)
          old_voice='<button class="voice-button" id="voice-button"><span class="mic-badge"><svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg></span><span>${t(\'voice\')}</span></button><div id="voice-status" class="voice-status"></div>'
          new_voice='<div class="voice-actions"><button class="voice-button" id="voice-button"><span class="mic-badge"><svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg></span><span class="voice-label">${t(\'voice\')}</span></button><button class="audio-upload-button" id="audio-upload-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg><span>${state.language===\'kk\'?\'Аудиофайл таңдау\':\'Выбрать аудиофайл\'}</span></button></div><div id="voice-status" class="voice-status"></div>'
          if js.count(old_voice)!=1: raise SystemExit('Voice controls marker not found exactly once')
          js=js.replace(old_voice,new_voice,1)
          old_label="label=button.querySelector('span');"
          new_label="label=button.querySelector('.voice-label');"
          if js.count(old_label)!=1: raise SystemExit('Voice label marker not found exactly once')
          js=js.replace(old_label,new_label,1)
          old_event="if(b.id==='voice-button')return toggleVoice();if(b.id==='ask-judge')"
          new_event="if(b.id==='voice-button')return toggleVoice();if(b.id==='audio-upload-button')return fileInput.click();if(b.id==='ask-judge')"
          if js.count(old_event)!=1: raise SystemExit('Audio file event marker not found exactly once')
          js=js.replace(old_event,new_event,1)
          app.write_text(js)

          css=Path('miniapp/styles.css')
          styles=css.read_text()
          styles += """
          .voice-actions{display:grid;grid-template-columns:1.35fr .9fr;gap:8px;margin-top:9px}.voice-actions .voice-button{margin:0}.audio-upload-button{min-height:58px;border:1px solid var(--line);border-radius:15px;background:var(--white);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;font-size:10px;font-weight:750}.audio-upload-button svg{width:20px;height:20px;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.voice-label{display:inline-block}
          @media(min-width:860px){html{background:#e9edfb}body{padding:24px 0 110px;background:radial-gradient(circle at 10% 5%,rgba(202,255,61,.22),transparent 24%),radial-gradient(circle at 92% 12%,rgba(23,73,255,.18),transparent 28%),#eef1fa}.screen{width:calc(100% - 48px);max-width:1000px;min-height:calc(100dvh - 48px);padding:20px 34px 105px;background:var(--paper);border:1px solid rgba(16,24,32,.07);border-radius:30px;box-shadow:0 24px 70px rgba(24,38,80,.13)}.screen-home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);grid-template-rows:auto auto auto auto;column-gap:20px;align-content:start}.screen-home>.brand-bar{grid-column:1/-1}.screen-home>.onboarding{grid-column:1/-1;width:100%;max-width:540px;margin:auto}.screen-home>.home-greeting{grid-column:1;grid-row:2}.screen-home>.training-banner{grid-column:1;grid-row:3}.screen-home>.quick-grid{grid-column:1;grid-row:4;margin-bottom:0}.screen-home>.dark-progress{grid-column:2;grid-row:2;align-self:end;min-height:125px}.screen-home>.section-title{grid-column:2;grid-row:3;align-self:end;margin-bottom:9px}.screen-home>.today-card{grid-column:2;grid-row:4;align-self:start;min-height:132px}.screen-train{max-width:760px}.screen-plan,.screen-progress,.screen-profile{max-width:850px}.screen-progress .stats-panel{grid-template-columns:repeat(4,1fr)}.screen-progress .criteria-grid{grid-template-columns:repeat(3,1fr)}.schedule-row{grid-template-columns:48px 30px 1fr 28px;padding:15px}.schedule-row>div:nth-of-type(2) small{max-width:520px}.bottom-nav{left:50%;right:auto;bottom:18px;width:min(620px,calc(100% - 48px));height:70px;max-width:none;transform:translateX(-50%);border:1px solid rgba(16,24,32,.09);border-radius:23px;box-shadow:0 13px 36px rgba(24,38,80,.16);overflow:hidden}.toast{left:50%;right:auto;width:min(520px,calc(100% - 48px));transform:translateX(-50%);bottom:102px}.answer-box{min-height:170px}.page-head h1{font-size:30px}.topic{font-size:27px}.feedback{grid-template-columns:repeat(2,1