name: Diagnose final BPF build
on:
  push:
    paths:
      - .github/workflows/diagnose-bpf-build.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply migration and capture build
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/bpf2.log 2>&1
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/apply-bpf-cases.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script, removed = re.subn(r"old_view = .*?frontend\.write_text\(js\)", "frontend.write_text(js)", script, count=1, flags=re.S)
          print('removed_ui_blocks=', removed)
          script = script.replace('re.subn(session_pattern, session_replacement, text, count=1)','re.subn(session_pattern, lambda _match: session_replacement, text, count=1)')
          script = script.replace('re.subn(create_pattern, create_replacement, text, count=1, flags=re.S)','re.subn(create_pattern, lambda _match: create_replacement, text, count=1, flags=re.S)')
          exec(compile(script, 'prepared_bpf_migration.py', 'exec'))
          PY
          M=$?
          B=99
          J=99
          if [ "$M" -eq 0 ]; then
            corepack enable >> /tmp/bpf2.log 2>&1
            corepack prepare pnpm@9.12.0 --activate >> /tmp/bpf2.log 2>&1
            pnpm install --no-frozen-lockfile >> /tmp/bpf2.log 2>&1
            pnpm run build >> /tmp/bpf2.log 2>&1
            B=$?
            node --check miniapp/app.js >> /tmp/bpf2.log 2>&1
            J=$?
          fi
          printf 'migration_status=%s\nbuild_status=%s\njs_status=%s\n\n' "$M" "$B" "$J" > /tmp/bpf2-status.log
          git reset --hard HEAD
          cat /tmp/bpf2-status.log /tmp/bpf2.log > BPF_DIAGNOSTIC_2.txt
          rm .github/workflows/diagnose-bpf-build.yml
          git config user.name "Talqyla Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add BPF_DIAGNOSTIC_2.txt .github/workflows/diagnose-bpf-build.yml
          git commit -m "Record final BPF build diagnostic"
          git push origin main
