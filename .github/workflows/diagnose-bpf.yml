name: Diagnose BPF migration
on:
  push:
    paths:
      - .github/workflows/diagnose-bpf.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run migration and capture status
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/migration.log 2>&1
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/apply-bpf-cases.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script, count = re.subn(r"old_view = .*?frontend\.write_text\(js\)", "frontend.write_text(js)", script, count=1, flags=re.S)
          print('removed_ui_blocks=', count)
          exec(compile(script, 'prepared_bpf_migration.py', 'exec'))
          PY
          MIGRATION_STATUS=$?
          BUILD_STATUS=99
          JS_STATUS=99
          if [ "$MIGRATION_STATUS" -eq 0 ]; then
            corepack enable >> /tmp/migration.log 2>&1
            corepack prepare pnpm@9.12.0 --activate >> /tmp/migration.log 2>&1
            pnpm install --no-frozen-lockfile >> /tmp/migration.log 2>&1
            pnpm run build >> /tmp/migration.log 2>&1
            BUILD_STATUS=$?
            node --check miniapp/app.js >> /tmp/migration.log 2>&1
            JS_STATUS=$?
          fi
          printf 'migration_status=%s\nbuild_status=%s\njs_status=%s\n\n' "$MIGRATION_STATUS" "$BUILD_STATUS" "$JS_STATUS" > /tmp/status.log
          git reset --hard HEAD
          cat /tmp/status.log /tmp/migration.log > BPF_DIAGNOSTIC.txt
          rm .github/workflows/diagnose-bpf.yml
          git config user.name "Talqyla Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add BPF_DIAGNOSTIC.txt .github/workflows/diagnose-bpf.yml
          git commit -m "Record BPF migration diagnostic"
          git push origin main
