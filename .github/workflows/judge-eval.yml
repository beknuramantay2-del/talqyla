# Ночная оценка судьи по golden-set.
#
# Тратит настоящие токены, поэтому не входит в CI на каждый пуш. Отвечает на
# вопрос, без которого продукт нельзя выпускать: оценки, которые мы показываем
# ученику, стабильны и близки к эталонным?
#
# v2 меряет судью РЕЧИ. Судья раундов v1 остался в репозитории ради истории,
# но продукт им не пользуется, поэтому он больше не блокирует прогон.
#
# Нужен секрет OPENROUTER_API_KEY. Без него job пропускается, а не падает,
# чтобы форки не заваливало красными билдами.

name: Judge eval

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      maeThreshold:
        description: 'Порог средней абсолютной ошибки'
        required: false
        default: '1.5'
      drillThreshold:
        description: 'Минимальная доля дриллов, попавших в слабое место'
        required: false
        default: '0.6'

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Eval не трогает Postgres и Redis, но @talqyla/config валидирует всё
      # окружение на импорте, поэтому переменные обязаны распарситься.
      NODE_ENV: development
      DATABASE_URL: postgresql://eval:eval@localhost:5432/eval?schema=public
      REDIS_URL: redis://localhost:6379
      API_BASE_URL: http://localhost:4000
      JWT_ACCESS_SECRET: eval-only-secret-not-a-credential
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MAE_THRESHOLD: ${{ github.event.inputs.maeThreshold || '1.5' }}
      EVAL_SPREAD_THRESHOLD: '2.0'
      EVAL_DRILL_THRESHOLD: ${{ github.event.inputs.drillThreshold || '0.6' }}

    steps:
      - uses: actions/checkout@v7

      - name: Skip when no API key is configured
        id: guard
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY не настроен — пропускаю live-eval."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.run == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.guard.outputs.run == 'true'
        run: pnpm db:generate

      # Основной прогон: точность, стабильность и попадание дрилла.
      - name: Run speech judge eval (v2)
        if: steps.guard.outputs.run == 'true'
        run: pnpm eval:speech:live

      # Судья v1 больше не в продукте: гоняем только как отчёт, не как гейт.
      - name: Run legacy round judge eval (report only)
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: pnpm eval:judge:live
