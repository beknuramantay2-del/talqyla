# Nightly judge evaluation against the golden set.
name: Judge eval
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      maeThreshold:
        description: 'Порог средней абсолютной ошибки'
        required: false
        default: '1.5'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://eval:eval@localhost:5432/eval?schema=public
      REDIS_URL: redis://localhost:6379
      API_BASE_URL: http://localhost:4000
      JWT_ACCESS_SECRET: eval-only-secret-not-a-credential
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MAE_THRESHOLD: ${{ github.event.inputs.maeThreshold || '1.5' }}
      EVAL_SPREAD_THRESHOLD: '2.0'
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no API key is configured
        id: guard
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY не настроен - пропускаю live-eval."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        if: steps.guard.outputs.run == 'true'
        run: pnpm db:generate
      - name: Run judge eval
        if: steps.guard.outputs.run == 'true'
        run: pnpm eval:judge:live
