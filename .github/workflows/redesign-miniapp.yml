name: Redesign Talqyla Mini App
on:
  push:
    paths:
      - .github/workflows/redesign-miniapp.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply full visual redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('miniapp/app.js')
          js=app.read_text()
          js=js.replace("tg?.setHeaderColor?.('#f4f1e8');tg?.setBackgroundColor?.('#f4f1e8')","tg?.setHeaderColor?.('#f7f7f3');tg?.setBackgroundColor?.('#f7f7f3')",1)
          js=js.replace("['home','plan','train','progress','profile']","['home','progress','plan','profile']",1)

          def swap(pattern,replacement,label):
              global js
              js,count=re.subn(pattern,lambda _:replacement,js,count=1,flags=re.S)
              if count!=1: raise SystemExit(f'{label}: expected one match, found {count}')

          shell="""function brand(){return `<header class=\"brand-bar\"><div><span class=\"wordmark\">talqyla<sup>+</sup></span><small>mini app</small></div><span class=\"brand-spark\">✦</span></header>`}const averageScore=()=>{const values=Object.values(state.skills).map(Number).filter(Number.isFinite);return values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):null};const currentStreak=()=>{const days=[...new Set(state.history.map(x=>String(x.date||'').slice(0,10)).filter(Boolean))].sort().reverse();if(!days.length)return 0;let streak=0,date=new Date();for(const day of days){const expected=date.toISOString().slice(0,10);if(day===expected){streak++;date.setUTCDate(date.getUTCDate()-1)}else if(streak===0){date.setUTCDate(date.getUTCDate()-1);if(day===date.toISOString().slice(0,10)){streak++;date.setUTCDate(date.getUTCDate()-1)}else break}else break}return streak};function shell(html,show=true){app.innerHTML=`<main class=\"screen\">${state.onboarded?brand():''}${html}</main>`;nav.classList.toggle('hidden',!show);if(show)updateNav()}
function onboarding"""
          swap(r"function shell\(html,show=true\)\{.*?\}\nfunction onboarding",shell,'shell')

          onboarding="""function onboarding(){shell(`<section class=\"onboarding\"><div class=\"onboard-logo\">talqyla<sup>+</sup></div><span class=\"onboard-tag\">ИИ-тренажёр для дебатов</span><h1>Говори точнее.<br><span>Аргументируй сильнее.</span></h1><p>Персональные БПФ-кейсы, голосовые ответы и честный разбор только по твоим словам.</p><h3>Выберите язык / Тілді таңдаңыз</h3><div class=\"language-grid\"><button data-lang=\"ru\">Русский</button><button data-lang=\"kk\">Қазақша</button></div><button id=\"continue-language\" class=\"primary wide\" disabled>Продолжить / Жалғастыру</button></section>`,false)}function skillRows"""
          swap(r"function onboarding\(\)\{.*?\}function skillRows",onboarding,'onboarding')

          home="""function home(){const ru=state.language!=='kk',name=esc(state.name||(ru?'друг':'дос')),avg=averageScore(),last=state.history[0];shell(`<header class=\"home-greeting\"><h1>${ru?'Привет':'Сәлем'},<br><span>${name}!</span></h1><p>${ru?'Сегодня ты станешь сильнее в аргументации 💪':'Бүгін аргументацияңды күшейтесің 💪'}</p><i class=\"shape shape-blue\"></i><i class=\"shape shape-lime\"></i></header><button class=\"training-banner\" data-go=\"train\"><span class=\"bolt\">ϟ</span><span><b>${ru?'Начать тренировку':'Жаттығуды бастау'}</b><small>${ru?'Новый уникальный БПФ-кейс уже ждёт':'Жаңа бірегей БПФ-кейс дайын'}</small></span><strong>→</strong></button><div class=\"quick-grid\"><button class=\"quick-card\" data-go=\"train\"><span class=\"quick-icon target-icon\">◎</span><b>${ru?'Тренировка 1v1 с ИИ':'ЖИ-мен 1v1 жаттығу'}</b><small>→</small></button><button class=\"quick-card\" data-go=\"progress\"><span class=\"quick-icon chart-icon\">▥</span><b>${ru?'Анализ и фидбек':'Талдау және пікір'}</b><small>→</small></button></div><section class=\"dark-progress\"><div><small>${ru?'Твой прогресс':'Сенің прогресің'}</small><h2>${avg==null?(ru?'Первый раунд впереди':'Алғашқы раунд алда'):avg+'/100'}</h2><p>${state.completed?ru?'Тренировок: '+state.completed:'Жаттығулар: '+state.completed:ru?'Начни — и здесь появится реальный результат':'Баста — мұнда нақты нәтиже пайда болады'}</p></div><div class=\"progress-orb\">${avg==null?'—':avg}</div><div class=\"hero-bar\"><i style=\"width:${avg||0}%\"></i></div></section><div class=\"section-title\"><h2>${ru?'Сегодня':'Бүгін'}</h2></div><button class=\"today-card\" data-go=\"train\"><span>💬</span><div><small>${ru?'Новый кейс':'Жаңа кейс'}</small><b>${last?esc(last.topic):ru?'Уникальная тема создастся при старте':'Бірегей тақырып басталғанда жасалады'}</b></div><strong>›</strong></button>`)}function plan"""
          swap(r"function home\(\)\{.*?\}function plan",home,'home')

          plan="""function plan(){const ru=state.language!=='kk',p=state.history[0]?.plan,items=p?.exercises||[];shell(`<header class=\"page-head plan-head\"><h1>${ru?'Твой план':'Сенің жоспарың'}</h1><p>${ru?'Обновляется после каждого реального раунда':'Әр нақты раундтан кейін жаңартылады'}</p></header><div class=\"plan-tabs\"><b>${ru?'Неделя':'Апта'}</b><span>${ru?'Следующий фокус':'Келесі бағыт'}</span></div>${p?`<section class=\"focus-card\"><small>${ru?'Главный фокус':'Негізгі бағыт'}</small><h2>${esc(p.focus)}</h2><p>${esc(p.why)}</p></section><div class=\"schedule\">${items.map((x,i)=>`<article class=\"schedule-row\"><div class=\"schedule-day\"><small>${String(i+1).padStart(2,'0')}</small><b>${ru?'Шаг':'Қадам'}</b></div><span class=\"task-check\">${i===0?'✓':''}</span><div><b>${esc(x)}</b><small>${ru?'Практика по итогам твоего раунда':'Сенің раундың бойынша тәжірибе'}</small></div><button data-go=\"train\">›</button></article>`).join('')}</div><button class=\"primary wide\" data-go=\"train\">${ru?'Начать практику':'Тәжірибені бастау'}</button>`:`<section class=\"empty-plan\"><span>✦</span><h2>${ru?'План ещё не создан':'Жоспар әлі жасалмады'}</h2><p>${ru?'Заверши первый раунд — судья создаст персональный план по твоим ответам.':'Алғашқы раундты аяқта — төреші жауаптарың бойынша жеке жоспар жасайды.'}</p><button class=\"primary\" data-go=\"train\">${t('begin')}</button></section>`}`)}function train"""
          swap(r"function plan\(\)\{.*?\}function train",plan,'plan')

          progress="""function progress(){const ru=state.language!=='kk',avg=averageScore(),last=state.history[0],scores=state.history.slice(0,7).reverse();shell(`<header class=\"page-head\"><h1>${ru?'Твой прогресс':'Сенің прогресің'}</h1></header><section class=\"stats-panel\"><div><small>${ru?'Средний результат':'Орташа нәтиже'}</small><b>${avg==null?'—':avg+'/100'}</b></div><div><small>${ru?'Всего тренировок':'Барлық жаттығу'}</small><b>${state.completed}</b></div><div><small>${ru?'Последний раунд':'Соңғы раунд'}</small><b>${last?last.score+'/100':'—'}</b></div><div><small>${ru?'Дней подряд':'Күн қатарынан'}</small><b>${currentStreak()}</b></div></section><div class=\"section-title\"><h2>${t('skills')}</h2></div><section class=\"skills modern-skills\">${skillRows()}</section><div class=\"section-title\"><h2>${ru?'Динамика':'Динамика'}</h2><small>${ru?'Последние реальные раунды':'Соңғы нақты раундтар'}</small></div>${scores.length?`<section class=\"trend-card\"><div class=\"trend-bars\">${scores.map((x,i)=>`<i style=\"height:${Math.max(8,x.score)}%\"><span>${x.score}</span></i>`).join('')}</div></section>`:`<section class=\"card empty\"><b>${t('empty')}</b><p>${t('emptyText')}</p></section>`}<div class=\"section-title\"><h2>${t('history')}</h2></div><div class=\"history\">${state.history.map(x=>`<article class=\"history-row card\"><div><h3>${esc(x.topic)}</h3><p>${esc(x.skill)}</p></div><b>${x.score}</b></article>`).join('')}</div>`)}function profile"""
          swap(r"function progress\(\)\{.*?\}function profile",progress,'progress')

          profile="""function profile(){const ru=state.language!=='kk',avg=averageScore(),streak=currentStreak(),initial=state.name?esc(state.name[0].toUpperCase()):'T';const achievements=[{icon:'★',name:ru?'Первый раунд':'Алғашқы раунд',on:state.completed>=1},{icon:'▣',name:ru?'70+ баллов':'70+ ұпай',on:state.history.some(x=>x.score>=70)},{icon:'ϟ',name:ru?'5 тренировок':'5 жаттығу',on:state.completed>=5}];shell(`<header class=\"profile-top\"><div class=\"profile-avatar\">${initial}</div><div><h1>${esc(state.name||(ru?'Ученик':'Оқушы'))}</h1>${telegramUser.username?`<p>@${esc(telegramUser.username)}</p>`:''}</div><span>⚙</span></header><section class=\"profile-stats\"><div><span>◉</span><b>${state.completed}</b><small>${ru?'Тренировок':'Жаттығу'}</small></div><div><span>♨</span><b>${streak}</b><small>${ru?'Дней подряд':'Күн қатарынан'}</small></div><div><span>★</span><b>${avg==null?'—':avg}</b><small>${ru?'Средний балл':'Орташа ұпай'}</small></div></section><div class=\"section-title\"><h2>${ru?'Достижения':'Жетістіктер'}</h2></div><section class=\"achievements\">${achievements.map(a=>`<div class=\"achievement ${a.on?'earned':'locked'}\"><span>${a.on?a.icon:'◼'}</span><small>${a.name}</small></div>`).join('')}</section><div class=\"section-title\"><h2>${ru?'Настройки':'Баптаулар'}</h2></div><section class=\"settings-list\"><div><span>◎</span><b>${t('language')}</b><small>${state.language==='kk'?'Қазақша':'Русский'} ›</small></div><div><span>ⓘ</span><b>${ru?'О приложении':'Қолданба туралы'}</b><small>v1.0 ›</small></div></section><button class=\"reset-link\" id=\"reset-data\">${t('reset')}</button>`)}function go"""
          swap(r"function profile\(\)\{.*?\}function go",profile,'profile')
          app.write_text(js)

          index=Path('miniapp/index.html')
          index.write_text("""<!doctype html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no\"><meta name=\"theme-color\" content=\"#f7f7f3\"><title>Talqyla</title><link rel=\"stylesheet\" href=\"/styles.css?v=9\"><script src=\"https://telegram.org/js/telegram-web-app.js\"></script></head><body><div id=\"app\"><div class=\"splash\"><b>talqyla<sup>+</sup></b></div></div><nav id=\"nav\" class=\"bottom-nav hidden\"><button data-nav=\"home\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 11 12 3l9 8v9H15v-7H9v7H3z\"/></svg><span>Главная</span></button><button data-nav=\"progress\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 20V10m5 10V5m5 15v-8m5 8V3\"/></svg><span>Прогресс</span></button><button data-nav=\"plan\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 3v4m10-4v4M3 10h18\"/></svg><span>План</span></button><button data-nav=\"profile\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1-5 4-7 8-7s7 2 8 7\"/></svg><span>Профиль</span></button></nav><input id=\"audio-file\" type=\"file\" accept=\"audio/*\" capture hidden><script type=\"module\" src=\"/app.js?v=9\"></script></body></html>""")

          css=Path('miniapp/styles.css')
          css.write_text(""":root{--paper:#f7f7f3;--white:#fff;--ink:#101820;--muted:#7e858b;--line:#e8e9e5;--blue:#1749ff;--blue2:#2d5bff;--lime:#caff3d;--navy:#0d1a27;--soft:#f0f1ed;--orange:#ff9c43}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Display\",\"SF Pro Text\",Arial,sans-serif}body{padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom))}button,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.screen{max-width:560px;margin:auto;padding:10px 18px 26px}.brand-bar{height:54px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:8px}.brand-bar>div{display:flex;flex-direction:column;align-items:center;line-height:1}.wordmark,.onboard-logo{font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Display\",Arial,sans-serif;font-weight:900;letter-spacing:-1.8px}.wordmark{font-size:21px}.wordmark sup,.onboard-logo sup,.splash sup{color:var(--lime);font-size:.6em;margin-left:2px}.brand-bar small{font-size:8px;color:var(--muted);font-weight:600;margin-top:3px}.brand-spark{position:absolute;right:4px;color:var(--blue);font-size:20px}.splash{min-height:88vh;display:grid;place-items:center}.splash b{font-size:34px;font-weight:900;letter-spacing:-2px}.onboarding{min-height:88vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.onboard-logo{font-size:48px;line-height:1}.onboard-tag{color:var(--blue);font-weight:700;margin-top:8px}.onboarding h1{font-size:34px;line-height:1.03;letter-spacing:-1.5px;margin:34px 0 12px}.onboarding h1 span{color:var(--blue)}.onboarding p{color:var(--muted);font-size:14px;line-height:1.55}.onboarding h3{font-size:14px;margin-top:25px}.language-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:7px 0 12px}.language-grid button{padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--white);font-weight:800}.language-grid button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.primary,.secondary,.voice-button,.judge-send{border:0;border-radius:15px;padding:15px 17px;font-weight:800}.primary{background:var(--lime);color:var(--ink)}.primary:disabled{opacity:.45}.secondary{background:var(--navy);color:#fff}.wide{width:100%}.home-greeting{position:relative;min-height:125px;padding:10px 2px;overflow:hidden}.home-greeting h1{font-size:30px;line-height:1.02;letter-spacing:-1.2px;margin:0}.home-greeting h1 span{color:var(--blue)}.home-greeting p{width:65%;font-size:13px;color:var(--muted);line-height:1.35}.shape{position:absolute;display:block;transform:rotate(-32deg);border-radius:40px}.shape-blue{width:105px;height:25px;background:var(--blue);right:-25px;top:44px}.shape-lime{width:62px;height:22px;background:var(--lime);right:-8px;top:14px}.training-banner{width:100%;border:0;border-radius:20px;padding:17px;background:linear-gradient(135deg,#133dff,#245cff);color:#fff;display:grid;grid-template-columns:45px 1fr auto;align-items:center;text-align:left;box-shadow:0 10px 24px rgba(23,73,255,.2)}.training-banner .bolt{width:42px;height:42px;border-radius:13px;background:var(--lime);color:var(--blue);font-size:30px;font-weight:900;display:grid;place-items:center}.training-banner b{font-size:15px}.training-banner small{display:block;opacity:.75;font-size:10px;margin-top:3px}.training-banner>strong{font-size:24px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.quick-card{min-height:132px;border:1px solid var(--line);border-radius:18px;background:var(--white);padding:15px;text-align:left;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(16,24,32,.04)}.quick-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900}.target-icon{color:var(--blue);background:#e8edff}.chart-icon{color:var(--blue);background:#edf0ff}.q