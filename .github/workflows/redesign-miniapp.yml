      - name: Verify redesigned frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          node --check miniapp/app.js
          pnpm run build
      - name: Commit verified redesign
        run: |
          rm .github/workflows/redesign-miniapp.yml
          git config user.name "Talqyla Design Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Redesign Mini App with vivid Talqyla UI"
          git push origin main
