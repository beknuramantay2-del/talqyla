name: Repair BPF workflow
on:
  push:
    paths:
      - .github/workflows/repair-bpf-workflow.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove brittle UI replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/apply-bpf-cases.yml')
          text = path.read_text()
          pattern = r"          old_view = .*?          frontend\.write_text\(js\)\n"
          replacement = "          frontend.write_text(js)\n"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Brittle UI block not found')
          path.write_text(text)
          PY
          rm .github/workflows/repair-bpf-workflow.yml
      - name: Commit workflow repair
        run: |
          git config user.name "Talqyla Workflow Repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-bpf-cases.yml .github/workflows/repair-bpf-workflow.yml
          git commit -m "Retry verified BPF generation"
          git push origin main
