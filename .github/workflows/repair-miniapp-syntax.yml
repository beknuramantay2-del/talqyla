name: Repair Mini App syntax
on:
  push:
    paths:
      - .github/workflows/repair-miniapp-syntax.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair exact TypeScript expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/miniapp-app.ts')
          text = path.read_text()
          old = "Math.max(0,Math.min(5,Math.round(Number(source.score)||0)):0"
          new = "Math.max(0,Math.min(5,Math.round(Number(source.score)||0))):0"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one broken expression, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-miniapp-syntax.yml
      - name: Commit repair
        run: |
          git config user.name "Talqyla Build Repair"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/miniapp-app.ts .github/workflows/repair-miniapp-syntax.yml
          git commit -m "Fix Judge score expression syntax"
          git push origin main
