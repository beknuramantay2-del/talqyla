name: Run direct BPF migration
on:
  push:
    paths:
      - .github/workflows/run-bpf-migration.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute prepared migration without brittle UI block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/apply-bpf-cases.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('Prepared migration start not found')
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          pattern = r"old_view = .*?frontend\.write_text\(js\)"
          script, count = re.subn(pattern, "frontend.write_text(js)", script, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Brittle UI section not found in prepared migration')
          exec(compile(script, 'prepared_bpf_migration.py', 'exec'))
          PY
      - name: Verify backend and frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
          node --check miniapp/app.js
      - name: Commit verified BPF implementation
        run: |
          rm -f .github/workflows/apply-bpf-cases.yml .github/workflows/repair-bpf-workflow.yml .github/workflows/run-bpf-migration.yml
          git config user.name "Talqyla BPF Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Generate unique BPF situational cases"
          git push origin main
