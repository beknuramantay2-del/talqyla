# Talqyla security gate - SCHEDULED deep scan.
name: Security gate
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
env:
  NODE_ENV: development
  DATABASE_URL: postgresql://talqyla:talqyla@localhost:5432/talqyla?schema=public
  REDIS_URL: redis://localhost:6379
  API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
  CORS_ORIGIN: http://localhost:3000
  JWT_ACCESS_SECRET: ci-only-secret-not-a-credential
jobs:
  dependency-and-secrets:
    name: Weekly dependency and secret sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (critical)
        run: pnpm audit --prod --audit-level=critical
      - name: Full advisory report (informational)
        continue-on-error: true
        run: pnpm audit --audit-level=low
      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
