# ДебатоТренер — production stack.
# All secrets MUST be set via .env.production or Docker secrets.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# NOTE on passwords: POSTGRES_PASSWORD and REDIS_PASSWORD are interpolated into
# URLs below. Characters like @ : / ? # must be percent-encoded or the
# connection string silently points somewhere else. Safest: generate with
# `openssl rand -hex 32`, which is URL-safe by construction.

services:
  postgres:
    image: postgres:16-alpine
    container_name: talqyla-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talqyla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-talqyla}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talqyla} -d ${POSTGRES_DB:-talqyla}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talqyla_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: talqyla-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?err}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talqyla_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Schema migration, one shot, before anything serves traffic ──────────
  #
  # Without this the stack started the API against an EMPTY database: Postgres
  # was healthy, the API booted, and the first real request died on a missing
  # table. The API now waits for this container to exit successfully.
  #
  # Uses the `builder` stage of the API image because that is the only stage
  # that carries the Prisma CLI, the schema and the migrations folder; the slim
  # runner stage deliberately ships neither.
  #
  # `migrate deploy` applies committed migrations and nothing else. Never use
  # `migrate dev` here: it can reset the database.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: talqyla-prod-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-talqyla}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-talqyla}
    working_dir: /app/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - talqyla_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: talqyla-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-talqyla}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-talqyla}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?err}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      API_PORT: 4000
      API_BASE_URL: ${API_BASE_URL:?err}
      CORS_ORIGIN: ${CORS_ORIGIN:?err}
      RATE_LIMIT_MAX: "200"
      RATE_LIMIT_WINDOW_MS: "60000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?err}
      STT_PROVIDER: ${STT_PROVIDER:-stub}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-stub}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      STORAGE_DIR: /app/storage
    volumes:
      - api_storage:/app/storage
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - talqyla_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: talqyla-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?err}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - talqyla_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  talqyla_prod:
    driver: bridge

volumes:
  pg_prod_data:
  redis_prod_data:
  api_storage:
